# PR Agent review policy for GT4Py. Read from the default branch, so a pull
# request cannot change the policy for its own review -- and so edits here only
# take effect once merged. See docs/development/tools/pr-agent.md.

[config]
# Release PRs are generated and have nothing to review. The first pattern is
# PR Agent's own default, which setting this key would otherwise drop.
ignore_pr_title = ["^\\[Auto\\]", "^Releasing v"]
# Extend these files rather than restating their rules here; the review rules
# are shared with GitHub Copilot's reviewer rather than kept in two places.
# Every listed file is sent with every prompt, so the list is kept short, and
# they share one line budget that truncates from the end -- hence the file
# 'extra_instructions' names is listed first.
repo_context_files = [".github/copilot-instructions.md", "AGENTS.md", "src/gt4py/next/AGENTS.md"]

[pr_code_suggestions]
# Raised above the default to drop marginal suggestions.
suggestions_score_threshold = 6

[pr_reviewer]
extra_instructions = "Follow the review rules in `.github/copilot-instructions.md`, included in the repository context below."
# An updated review already replaces its own comment in place; the default
# also posts a second comment pointing at it, which is noise on a PR that
# gets several pushes.
final_update_message = false
# GT4Py PRs rarely reference a tracked ticket, so this spends tokens for little.
require_ticket_analysis_review = false
