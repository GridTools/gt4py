# PR Agent review policy. Read from the default branch, so a pull request
# cannot change the policy for its own review.
# See docs/development/tools/pr-agent.md.

[config]
# Release PRs are generated. The first pattern is PR Agent's default, which
# setting this key would otherwise drop.
ignore_pr_title = ["^\\[Auto\\]", "^Releasing v"]
# The review is not always produced by the primary model, and which one
# answered explains a thin review without reading the run log.
output_run_details = true
# The review rules live in these files, shared with GitHub Copilot's reviewer.
# They share one line budget that truncates from the end, so the file named in
# 'extra_instructions' goes first.
repo_context_files = [".github/copilot-instructions.md", "AGENTS.md", "src/gt4py/next/AGENTS.md"]

[pr_code_suggestions]
# Above the default, to drop marginal suggestions.
suggestions_score_threshold = 6

[pr_reviewer]
extra_instructions = "Follow the review rules in `.github/copilot-instructions.md`, included in the repository context below."
# An updated review replaces its comment in place; a second comment pointing
# at it is noise.
final_update_message = false
# GT4Py PRs rarely reference a ticket.
require_ticket_analysis_review = false
