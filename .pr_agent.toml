# PR Agent review policy for GT4Py.
#
# Only review *policy* belongs here. The inference endpoint, the model and its
# token limits are set in '.github/workflows/pr-agent.yml' from repository
# variables.
#
# Be careful about what that does and does not protect. PR Agent reads this file
# from the default branch, so a pull request cannot change review policy by
# editing its own copy. The endpoint and credential are additionally host-only:
# PR Agent refuses them as comment arguments. The model and the ordinary token
# limits are NOT in that protected set, so an authorized commenter can override
# them for a single invocation -- which is a reason to keep comment commands
# restricted to users with real write access, as the workflow does.
#
# PR Agent reads this file from the default branch, so changes take effect only
# once merged to 'main'.

[config]
# Skip release PRs, which are generated and have no code to review.
# The first pattern is PR Agent's own default; setting this key replaces it.
ignore_pr_title = ["^\\[Auto\\]", "^Releasing v"]
# PR Agent reads these into every prompt, from the default branch. Unlike
# GitHub Copilot -- which only reads '.github/' files and so needs the
# review rules restated in '.github/copilot-instructions.md' -- PR Agent can
# read the real instruction files, so do not duplicate them here.
# Budget is 'config.repo_context_max_lines' (500) in total; these two are ~210
# lines, which leaves headroom. 'CODING_GUIDELINES.md' (~240 lines) is
# deliberately left out to stay inside that budget; AGENTS.md cites it as
# authoritative for anything a reviewer needs to look up.
repo_context_files = ["AGENTS.md", "src/gt4py/next/AGENTS.md"]

[pr_code_suggestions]
# Only surfaces on an explicit '/improve'. Default is 1, i.e. keep almost
# everything; raised to drop marginal suggestions.
suggestions_score_threshold = 6

[pr_reviewer]
# Both default to true, which makes '/review' set 'Review effort N/5' and
# 'Possible security concern' labels through the issues API -- and remove
# previously matching ones. The label contents come from model output derived
# from an untrusted diff, so text in a PR can steer which labels the bot
# applies and clears. Review output stays comments only.
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """\
Review scope for this repository:

- Flag new or changed code paths (branches, early returns, error and exception
  paths, new public functions) whose behaviour is not covered by a test in the
  matching `tests/<subpackage>_tests/` tree. Tests are the spec here.
- Flag unhandled edge cases: empty or zero-dimensional fields, mismatched or
  non-promotable dimensions, off-by-one errors in domain or offset arithmetic,
  integer-vs-float dtype assumptions, and `None` / optional inputs.
- Flag missing error handling on I/O, filesystem or subprocess calls (compiler
  and build invocation), where failure would surface as an opaque crash.
- Flag a new runtime dependency (`pyproject.toml` `dependencies =`) that has no
  matching ADR under `docs/development/ADRs/`.

Stay silent about:

- Formatting and import order. `ruff` owns those, and pre-commit and CI enforce
  them.
- Missing license headers. Pre-commit inserts them automatically.
- Missing docstrings on private or internal helpers.
- Anything `tach`, `ruff` or `mypy` already enforces deterministically, since CI
  catches it without a comment.

Style:

- One comment per distinct issue, leading with the risk and then the fix.
- Cite evidence as `path/to/file.py:LINE`.
- For a PR that changes architecture, question the design and propose
  refactorings where warranted. For a localized fix, prefer the smallest change
  over a refactor.
- Phrase a finding that is a question rather than a defect as a question.
"""
# Avoids a "No major issues detected" comment on every clean PR.
publish_output_no_suggestions = false
# No Jira / Linear integration here, so ticket analysis would spend tokens on
# nothing.
require_ticket_analysis_review = false
