# AWF (github/gh-aw-firewall) configuration for the agent review sandbox.
# Schema: https://github.com/github/gh-aw-firewall (docs/awf-config-spec.md).
#
# Read from the workflow's own commit, never from the PR. The 'review' job
# renders it to JSON and sets 'apiProxy.allowedModels' to the configured model
# (repository variable AGENT_REVIEW_MODEL) and 'filesystem.allowWrite' to the
# review workspace; host paths (--audit-dir, --proxy-logs-dir,
# --container-workdir) and image digests (--image-tag) are passed as
# command-line flags.
#
# Verified by the Phase 0 probe on AWF v0.29.12 (fork runs 43326894660 to
# 43331077096): the dummy key is unreadable in the sandbox in every mode; the
# CSCS path mapping; the model pattern format; 'maxTurns' and
# 'rateLimiting' answer 429; 'agentTimeout' ends the agent with exit 124.

network:
  # Only for the in-sandbox 'git fetch' of the public repository. The
  # inference host is added by AWF for the API-proxy sidecar from
  # 'apiProxy.targets'; the agent reaching it directly has no key.
  allowDomains:
    - github.com

apiProxy:
  # The real key is given to the sidecar only, through the 'awf' step's
  # environment (OPENAI_API_KEY); the agent gets placeholders.
  # One upstream and one listener for every harness. No 'anthropic' target:
  # 'POST /messages' on AWF's Anthropic listener is not counted by 'maxTurns'
  # (v0.29.12). Anthropic-API clients can use the OpenAI listener, which
  # forwards '/v1/messages' with a Bearer token (CSCS accepts it).
  targets:
    openai:
      # Holds 'https://api.inference.cscs.ch/v1'. Harnesses use the listener
      # origin, $AWF_API_PROXY_OPENAI_URL; both '<origin>/v1/chat/completions'
      # and '<origin>/chat/completions' reach the upstream
      # '/v1/chat/completions'.
      baseUrlEnv: AGENT_REVIEW_OPENAI_BASE_URL
  # Placeholder; the 'review' job replaces it with 'openai/<model>': patterns
  # containing '/' are matched against '<provider>/<model>'. Other models
  # get a 403 'model_policy_violation' from the proxy.
  allowedModels:
    - none
  # Disable AWF's runtime model catalogue: in network-isolation mode its
  # sidecar otherwise makes ~7 GETs per run to api.github.com (the
  # github/gh-aw-firewall 'catalogue-data' branch) to refresh its pricing
  # snapshot. Those carry no data about the run (GET only, no Authorization),
  # but we do not use AWF's AI-credit accounting (the key budget and maxTurns
  # are the caps), so the egress and the up-to-5 s first-request wait are
  # pointless. Pricing then falls back to the bundled tables.
  # (AWF v0.29.12: containers/api-proxy/catalogue-loader.js:91,237.)
  modelCatalogue:
    enabled: false
  # Spend caps. The primary cap is the dedicated CSCS key's own token budget.
  # AWF prices unpriced CSCS models with a median estimate, so its AI-credit
  # cap is not a hard limit; the turn cap is used here.
  maxTurns: 80
  maxPermissionDenied: 5

rateLimiting:
  # Answered with 429 above the limit.
  requestsPerMinute: 30

container:
  # Minutes; the review step's own timeout is a few minutes longer so this
  # one triggers first and the result is still collected.
  agentTimeout: 25
  memoryLimit: 6g
  # TODO(phase0): pin images by digest with 'container.images' if passing
  # the setup action's 'image-tag' output (with digests) is not enough.

filesystem:
  # Placeholder; the 'review' job sets it to the review workspace, the only
  # host directory the sandbox may write to. Everything else AWF mounts (the
  # rest of the runner workspace, /tmp, ~/.config, ~/.local/bin, ...) is
  # read-only, so the host stays clean. Needs the default work dir and
  # pre-created mount points under /tmp/gh-aw (v0.29.12).
  allowWrite:
    - /nonexistent

logging:
  logLevel: info
