name: Documentation

# Builds the user documentation site (welcome page plus the 'cartesian' and
# 'next' subsites) and, for pushes to 'main' in the upstream repository,
# deploys it to GitHub Pages (which must use 'GitHub Actions' as source).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/user/**"
      - "noxfile.py"
      - "pyproject.toml"
      - "src/gt4py/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the documentation site
        shell: bash
        run: ./noxfile.py -s docs

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/user/_build/html

  deploy:
    needs: build
    if: github.repository == 'GridTools/gt4py' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
