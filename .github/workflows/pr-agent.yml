name: PR Agent

# Advisory AI review of pull requests with PR Agent
# (https://github.com/The-PR-Agent/pr-agent) on the CSCS inference service.
# Never a required status check. The model, its token limits and the endpoint
# are repository variables with defaults below. Details:
# docs/development/tools/ci-infrastructure.md#ai-assisted-pr-review-pr-agent

on:
  # 'pull_request_target' because fork PRs get no repository secrets under
  # 'pull_request'. Safe only while the job never checks out or runs PR code.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  # Comment commands, e.g. '/review' or '/improve'.
  issue_comment:
    types: [created]

  ## COMMENTED OUT: only for testing changes to this workflow.
  ## 'pull_request_target' and '.pr_agent.toml' are read from the default
  ## branch, so a PR cannot exercise its own changes to them. Uncommenting runs
  ## the PR's version, for branches in GridTools/gt4py only. Such a PR is then
  ## reviewed twice: both triggers fire, in separate concurrency groups.
  # pull_request:
  #   branches:
  #     - main
  ## END

# No 'contents: write': a prompt injection in a diff must not become a way to
# push. The two write scopes still let model output reach PR comments, labels,
# title and body. Automatic review only comments (its label writes are off in
# both '.pr_agent.toml' and this job's env); '/describe' and
# '/generate_labels' write PR metadata only when a maintainer asks. Do not
# widen these permissions.
permissions:
  contents: read
  issues: write
  pull-requests: write

# A run joins its concurrency group when queued, before the job 'if', so every
# comment on a PR creates a run in a group even when its job is then skipped.
#  - 'cancel-in-progress' stays false, or any comment would kill that PR's
#    in-flight review.
#  - A newer run evicts a pending one in the same group, so comment runs are
#    keyed on the comment id and a queued command cannot be displaced. PR-event
#    runs share one group per PR, where a newer automatic review replacing a
#    pending one saves an inference call.
# The event name keeps comment ids and PR numbers from colliding.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    # Structural filters only; authorization is the 'Authorize' step. Drafts
    # are skipped so a PR is reviewed once, when ready, rather than on both
    # 'opened' and 'ready_for_review'.
    if: >-
      github.event.sender.type != 'Bot'
      && (
        (
          (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
          && github.event.pull_request.draft == false
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/')
        )
      )
    runs-on: ubuntu-latest
    # The inference service has no availability guarantee, and an advisory
    # reviewer must not look like a CI failure. This hides real failures too:
    # when the bot is silent, read the run log, not the check status.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      # The only authorization point, for both paths: the actor (PR author for
      # automatic review, commenter for a command) needs write permission or
      # better. 'pull_request_target' runs for any fork PR regardless of the
      # repository's fork-approval setting, so without this anyone could spend
      # the CSCS allocation by opening PRs. An outside contributor's PR is
      # reviewed when a maintainer comments '/review'.
      #
      # Effective permission, not 'author_association': webhook payloads report
      # private organization members (nearly all of GridTools) as 'CONTRIBUTOR',
      # and 'MEMBER' or 'COLLABORATOR' do not imply write access anyway.
      #
      # Fails closed: if the bot is silent on both paths, read this step's log.
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Via env so a login is never substituted into the script.
          ACTOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event.pull_request.user.login }}
        run: |
          # An API failure is an error, not a denial, so a broken gate shows.
          if ! level=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>&1); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve repository permission for '${ACTOR}', denying: ${level}"
            exit 1
          fi
          case "${level}" in
            admin | maintain | write)
              echo "::notice::${ACTOR} has '${level}' permission; running PR Agent."
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::${ACTOR} has '${level}' permission; skipping PR Agent."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The models have no defaults, so an unset variable would otherwise reach
      # LiteLLM as an empty model string and fail inside the container, where
      # 'continue-on-error' would bury it. Fail here instead, by name.
      - name: Check model configuration
        if: steps.auth.outputs.allowed == 'true'
        env:
          MODEL: ${{ vars.PR_AGENT_MODEL }}
          FALLBACKS: ${{ vars.PR_AGENT_FALLBACK_MODELS }}
        run: |
          missing=()
          [ -n "${MODEL}" ] || missing+=("PR_AGENT_MODEL")
          [ -n "${FALLBACKS}" ] || missing+=("PR_AGENT_FALLBACK_MODELS (use '[]' for no fallback)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unset repository variable(s): ${missing[*]}. See docs/development/tools/ci-infrastructure.md#configuration-variables"
            exit 1
          fi
          echo "::notice::Model '${MODEL}', fallbacks '${FALLBACKS}'."

      # No 'actions/checkout', ever: PR Agent reads the diff through the GitHub
      # API, and checking out PR code in a 'pull_request_target' job that holds
      # a secret is what would make this workflow dangerous.
      #
      # Pinned by digest because the image receives the inference key. This is
      # the 0.50.0-github_action image; to upgrade, resolve the digest of the
      # new '<version>-github_action' tag and update this comment.
      - name: Run PR Agent
        # 'success()' is implicit for a step 'if', but spelled out because it is
        # what skips this step when the configuration check above fails.
        if: success() && steps.auth.outputs.allowed == 'true'
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- CSCS inference service (OpenAI-compatible route) ---
          # Key and endpoint are host-only in PR Agent: neither '.pr_agent.toml'
          # nor a comment argument can redirect inference. An authorized
          # commenter can still override the model and token settings per
          # invocation.
          OPENAI.KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.inference.cscs.ch/v1' }}
          # No defaults: every model PR Agent may call is chosen explicitly in
          # repository variables, checked by the step above.
          #
          # Both need an 'openai/' prefix, which is LiteLLM's selector for the
          # OpenAI-compatible route and not part of the model name. LiteLLM
          # strips it and sends the rest, so CSCS receives its own id --
          # 'openai/zai-org/GLM-5.3' arrives as 'zai-org/GLM-5.3'. Without the
          # prefix LiteLLM has no provider and fails with "LLM Provider NOT
          # provided", so do not "simplify" it to the bare id from
          # 'GET /v1/models'.
          config.model: ${{ vars.PR_AGENT_MODEL }}
          # Used when the primary errors or returns a truncated or empty answer.
          config.fallback_models: ${{ vars.PR_AGENT_FALLBACK_MODELS }}

          # --- Token budget: these three interact, do not tune one alone ---
          #
          #   context_window = min(MODEL_CONTEXT_WINDOW, TOKEN_BUDGET)
          #   diff_budget    = context_window - MAX_OUTPUT_TOKENS - prompt_tokens
          #
          # Defaults: min(131072, 65536) - 16384 = 49152 tokens of input (prompt
          # plus diff); larger diffs are clipped. If MAX_OUTPUT_TOKENS reaches
          # TOKEN_BUDGET the diff budget goes negative, every file is dropped
          # and the review fails with "No PR diff fits the /review request",
          # which only the run log shows because the job is 'continue-on-error'.
          # All three are properties of the model: change them together with
          # PR_AGENT_MODEL.

          # The model's context window. Required: the model is not in PR Agent's
          # model table, and an unknown model with no declared limit raises.
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_CONTEXT_WINDOW || '131072' }}
          # The window we allow. This is the operative cap on input.
          config.max_model_tokens: ${{ vars.PR_AGENT_TOKEN_BUDGET || '65536' }}
          # Reserved for the answer. CSCS serves reasoning models, which spend
          # this budget on reasoning first; left unset, a review can come back
          # truncated or empty. Values below 4096 are raised to 4096.
          config.max_output_tokens: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '16384' }}
          # Open-weight models follow the output schema more reliably when the
          # prompt examples are repeated.
          config.duplicate_prompt_examples: "true"

          # --- Which tools run automatically ---
          # Only '/review'. '/describe' would overwrite the PR title and body,
          # which here are the squash-commit message (Conventional Commits) and
          # the PR template, and it is the one command that rewrites PR metadata
          # from model output. '/improve' is on request only, to limit noise.
          # Both remain available as comments.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

          # Repeated from '.pr_agent.toml' on purpose. That file is fetched
          # over the GitHub API, and a non-404 failure there is only logged as
          # a warning before PR Agent carries on with its built-in defaults --
          # in which both of these are true, so a transient API error would let
          # an automatic review set and clear labels chosen by model output.
          # An env override cannot fail to load and takes precedence, so it
          # holds either way. The rest of '.pr_agent.toml' costs only noise or
          # tokens if it is missed, so it is not duplicated here.
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.enable_review_labels_security: "false"
