name: PR Agent

# AI-assisted PR review via PR Agent (https://github.com/The-PR-Agent/pr-agent),
# backed by the CSCS inference service. Advisory only: this workflow is never a
# required status check and must not gate merges.
#
# The model, its token limits and the endpoint come from repository variables so
# they can be retuned without a code change. Defaults below apply when a
# variable is unset, so the workflow is self-contained. The PR Agent version is
# pinned here rather than in a variable: GitHub does not allow expressions in a
# step's 'uses'.
#
# Rationale, the full variable list and operational notes:
# docs/development/tools/ci-infrastructure.md#ai-assisted-pr-review-pr-agent

on:
  # 'pull_request_target' and NOT 'pull_request': most GT4Py pull requests come
  # from forks, and fork PRs get no access to repository secrets, so a
  # 'pull_request' job could never read CSCS_INFERENCE_API_KEY. The usual
  # 'pull_request_target' hazard does not apply here because this job never
  # checks out or executes PR code (see the job steps).
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  # Lets maintainers invoke commands by commenting, e.g. '/review' or '/improve'.
  issue_comment:
    types: [created]

  ## COMMENTED OUT: only for testing changes to this workflow.
  ## 'pull_request_target' and '.pr_agent.toml' are both read from the base /
  ## default branch, so changes here have no effect until merged to 'main'.
  ## Uncommenting gives a real run on the PR that changes them, but only for
  ## PRs from branches in the upstream GridTools/gt4py repo.
  # pull_request:
  #   branches:
  #     - main
  ## END

# No 'contents: write': nothing here may push to the repository, so a prompt
# injection in a PR diff cannot become a source-write primitive. Note that this
# does NOT make the model's output inert -- 'issues: write' and
# 'pull-requests: write' let PR Agent publish comments, and would let it set
# labels or rewrite a PR title/body, all from model output derived from
# untrusted PR text. Automatic review is the only thing that runs unprompted,
# and its label writes are disabled in '.pr_agent.toml'; '/describe' and
# '/generate_labels' can still write PR metadata, but only when a maintainer
# asks for them. Keep it that way, and do not widen these permissions.
permissions:
  contents: read
  issues: write
  pull-requests: write

# A concurrency group is claimed when a run is QUEUED, before the job 'if' is
# evaluated, so an 'issue_comment' event joins its group even when its job is
# then skipped. Two consequences, and the group below is shaped to avoid both:
#
#  - 'cancel-in-progress' must stay false. With it on, any comment on a PR --
#    from anyone, including a plain "hi" -- would kill that PR's in-flight
#    review with no trace on the PR. That is both an outsider-reachable denial
#    of service and a self-inflicted one, since most comments in this repo are
#    'cscs-ci run ...', which routinely lands seconds after a PR is opened.
#  - Even with cancellation off, GitHub evicts an existing *pending* run when a
#    newer one joins the same group. Keying comment-triggered runs on the
#    comment id gives each command its own group, so a queued '/improve' cannot
#    be evicted by a later unrelated comment. PR-event runs still share a group
#    per pull request, where collapsing a redundant second automatic review is
#    the behaviour we want.
#
# The event name is part of the key so a comment id can never collide with a
# pull request number.
#
# Note 'queue: max' is deliberately NOT used here. It would stop the eviction
# above, but it would also make a redundant second automatic review queue and
# run instead of being collapsed, which costs a second inference call for no
# benefit. Per-event keying removes the eviction that matters -- a lost
# command -- while keeping the eviction that saves money.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    # This condition carries only cheap, structural filters. Authorization is
    # the 'Authorize' step's job -- deliberately NOT 'author_association',
    # which does not mean what it appears to: webhook payloads report 'MEMBER'
    # only for *public* organization members, and private members show up as
    # 'CONTRIBUTOR' or 'NONE'. GridTools has exactly one public member, so an
    # association gate here would skip essentially every core developer, and
    # 'continue-on-error' on a skipped job would make that silent.
    #
    # 'draft == false' avoids reviewing a PR twice. The Action's automatic path
    # has no draft check of its own (unlike its pull_request_review path), so
    # without this a draft PR is reviewed once on 'opened' and again on
    # 'ready_for_review'. This way each PR is reviewed once, when it is ready.
    if: >-
      github.event.sender.type != 'Bot'
      && (
        (
          (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
          && github.event.pull_request.draft == false
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/')
        )
      )
    runs-on: ubuntu-latest
    # CSCS states the inference service runs on a single infrastructure and that
    # "interruptions of the service should be expected". An advisory reviewer
    # must never look like a CI failure. Note this hides genuine failures too:
    # check the run log, not the PR's check status, when the bot stays silent.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      # The single authorization point, for BOTH paths: resolve the actor's
      # effective repository permission and require write or better. This is
      # what makes the automatic path safe -- 'pull_request_target' is exempt
      # from the "require approval for outside contributors" fork setting
      # ("workflows triggered by these events will always run, regardless of
      # approval settings"), so without a check here any stranger could spend
      # the project's CSCS allocation just by opening pull requests. An outside
      # contributor's PR is reviewed when a maintainer asks with '/review'.
      #
      # Effective permission rather than 'author_association' because the
      # latter is both wrong for private org members (see the job 'if') and too
      # weak: an org whose base permission is 'read' still yields 'MEMBER', and
      # 'COLLABORATOR' covers outside collaborators with read-only or triage
      # access. Such a principal could otherwise spend credit and, via
      # '/describe', have the bot rewrite a PR title and body they are not
      # allowed to edit themselves.
      #
      # Fails closed: any API error leaves 'allowed' false, which disables the
      # bot rather than opening it up. GitHub documents this endpoint as
      # accepting an installation access token with 'Metadata: read', which
      # GITHUB_TOKEN always carries, so a 403 is not expected -- but it has not
      # been exercised live. If the bot goes quiet everywhere, read this step's
      # log first.
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The PR author on the automatic path, the commenter on the command
          # path. Passed via env, not inline, so a login is never substituted
          # into the shell command.
          ACTOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event.pull_request.user.login }}
        run: |
          # "Could not ask" is reported differently from "asked, and denied".
          # Both deny, but only the first is a problem with this workflow, and
          # a silent deny is how a broken gate would hide.
          if ! level=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>&1); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve repository permission for '${ACTOR}', denying: ${level}"
            exit 1
          fi
          case "${level}" in
            admin | maintain | write)
              echo "::notice::${ACTOR} has '${level}' permission; running PR Agent."
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::${ACTOR} has '${level}' permission; skipping PR Agent."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Deliberately no 'actions/checkout': PR Agent reads the diff through the
      # GitHub API. Do not add one -- this job holds a secret under
      # 'pull_request_target', so checking out PR code would be the one change
      # that makes this workflow genuinely dangerous.
      #
      # Pinned by digest rather than tag because this job holds a secret;
      # sha256:548e894a8807... is the 0.50.0-github_action image. To upgrade,
      # bump the comment and re-resolve the digest from the release tag.
      - name: Run PR Agent
        if: steps.auth.outputs.allowed == 'true'
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- CSCS inference service (OpenAI-compatible route) ---
          # 'api_base' is a host-only setting: PR Agent rejects it as a comment
          # argument, so neither a PR's own '.pr_agent.toml' nor a '/review
          # --openai.api_base=...' comment can redirect inference. Ordinary
          # model and token settings are NOT protected that way and an
          # authorized commenter can override them per invocation.
          OPENAI.KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.inference.cscs.ch/v1' }}
          config.model: ${{ vars.PR_AGENT_MODEL || 'openai/zai-org/GLM-5.3' }}
          # On a truncated or empty response PR Agent moves to the fallback
          # model rather than retrying the same one
          # ('config.retry_same_model_on_length' is false by default), which is
          # what we want: Qwen spends far fewer tokens on reasoning.
          config.fallback_models: ${{ vars.PR_AGENT_FALLBACK_MODELS || '["openai/Qwen/Qwen3.8-27B-FP8"]' }}

          # --- Token budget: these three interact, do not tune one alone ---
          #
          # PR Agent computes, in pr_agent/algo/token_budget.py:
          #
          #   context_window = min(MODEL_CONTEXT_WINDOW, TOKEN_BUDGET)
          #   diff_budget    = context_window - MAX_OUTPUT_TOKENS
          #                                   - rendered_prompt_tokens
          #
          # The diff packer evaluates that budget unclamped, so an output
          # reserve at or above the token budget makes it negative and every
          # file is skipped as "too large". PR Agent then logs "Empty diff for
          # PR" and raises "No PR diff fits the /review request", exhausts the
          # fallback chain and fails. Because the job is 'continue-on-error'
          # the PR shows nothing at all, so the only trace is the run log.
          # Keep a wide margin between TOKEN_BUDGET and MAX_OUTPUT_TOKENS.
          #
          # With the defaults below: min(131072, 65536) - 16384 = 49152 tokens
          # of input, which is far more than a typical GT4Py PR needs (the
          # median is ~212 changed lines) while still bounding spend well below
          # the million-token window GLM-5.3 would otherwise accept. Oversized
          # diffs are clipped rather than rejected ('large_patch_policy').
          #
          # All three are properties of whichever model PR_AGENT_MODEL selects,
          # so all three are variables: changing the model without them is how
          # this gets misconfigured, and the failure is quiet.

          # What the model can do. Required because the model CSCS serves is
          # absent from PR Agent's model table, and an unknown model with no
          # declared limit raises. On its own this only raises a ceiling.
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_CONTEXT_WINDOW || '131072' }}
          # What we allow. This is the operative cap: it clamps the value
          # above, and is the number the input capacity is computed from.
          config.max_model_tokens: ${{ vars.PR_AGENT_TOKEN_BUDGET || '65536' }}
          # Headroom reserved for the answer. Load-bearing: every model CSCS
          # serves is a reasoning model, and reasoning tokens are spent from
          # this budget before any answer is emitted. Left unset (0), the
          # provider default applies and a review can come back truncated
          # mid-YAML or empty. Values below 4096 are raised to 4096, with a
          # warning in the run log.
          config.max_output_tokens: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '16384' }}
          # Open-weight models follow the output schema more reliably when the
          # prompt examples are repeated.
          config.duplicate_prompt_examples: "true"

          # --- Which tools run automatically ---
          # '/describe' stays off: a GT4Py PR title is the squash-commit message
          # and must follow Conventional Commits, and the PR body is the commit
          # body, so an overwritten description would fight
          # '.github/pull_request_template.md'. It is also the one command that
          # rewrites PR metadata from model output, so leaving it manual keeps a
          # human in front of that write. '/improve' stays off until the trial
          # says it earns its noise; both remain available as comments.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
