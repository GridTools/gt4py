name: PR Agent

# AI-assisted PR review via PR Agent (https://github.com/The-PR-Agent/pr-agent),
# backed by the CSCS inference service. Advisory only: this workflow is never a
# required status check and must not gate merges.
#
# The version, model and model limits come from repository variables so they can
# be retuned without a code change. Defaults below apply when a variable is
# unset, so the workflow is self-contained.
#
# Rationale, the full variable list and operational notes:
# docs/development/tools/ci-infrastructure.md#ai-assisted-pr-review-pr-agent

on:
  # 'pull_request_target' and NOT 'pull_request': most GT4Py pull requests come
  # from forks, and fork PRs get no access to repository secrets, so a
  # 'pull_request' job could never read CSCS_INFERENCE_API_KEY. The usual
  # 'pull_request_target' hazard does not apply here because this job never
  # checks out or executes PR code (see the job steps).
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  # Lets maintainers invoke commands by commenting, e.g. '/review' or '/improve'.
  issue_comment:
    types: [created]

  ## COMMENTED OUT: only for testing changes to this workflow.
  ## 'pull_request_target' and '.pr_agent.toml' are both read from the base /
  ## default branch, so changes here have no effect until merged to 'main'.
  ## Uncommenting gives a real run on the PR that changes them, but only for
  ## PRs from branches in the upstream GridTools/gt4py repo.
  # pull_request:
  #   branches:
  #     - main
  ## END

# No 'contents: write': nothing here may push to the repository. Raising this
# turns a prompt injection in a PR diff into a write primitive.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    # Auto-review runs on every PR: the spend is bounded by PR volume.
    # Comment-triggered commands are restricted to maintainers, because anyone
    # could otherwise drain the key by repeating '/improve'. This mirrors the
    # CSCS-CI convention of acting only on whitelisted users' comments.
    if: >-
      github.event.sender.type != 'Bot'
      && (
        github.event_name != 'issue_comment'
        || (
          github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    # CSCS states the inference service runs on a single infrastructure and that
    # "interruptions of the service should be expected". An advisory reviewer
    # must never look like a CI failure.
    continue-on-error: true
    # A job-level 'container' rather than the documented step-level
    # 'uses: docker://pragent/pr-agent:<version>-github_action', because GitHub
    # does not allow expressions in a step's 'uses', so the version could not
    # come from a repository variable there. Only the tag is variable; the image
    # repository stays hardcoded, which bounds what a change to repository
    # settings alone can point this job at.
    container:
      image: pragent/pr-agent:${{ vars.PR_AGENT_VERSION || '0.50.0' }}-github_action
    steps:
      # Deliberately no 'actions/checkout': PR Agent reads the diff through the
      # GitHub API. Do not add one -- this job holds a secret under
      # 'pull_request_target', so checking out PR code would be the one change
      # that makes this workflow genuinely dangerous.
      #
      # This is the image's own entrypoint. GitHub replaces a container's
      # ENTRYPOINT for container jobs, so it has to be invoked explicitly;
      # PYTHONPATH=/app and the virtualenv on PATH both come from the image.
      - name: Run PR Agent
        run: python /app/pr_agent/servers/github_action_runner.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- CSCS inference service (OpenAI-compatible route) ---
          # 'api_base' is a host-only setting: a PR's own '.pr_agent.toml'
          # cannot redirect inference to another endpoint.
          OPENAI.KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.inference.cscs.ch/v1' }}
          config.model: ${{ vars.PR_AGENT_MODEL || 'openai/zai-org/GLM-5.3' }}
          # On a truncated or empty response PR Agent moves to the fallback
          # model rather than retrying the same one
          # ('config.retry_same_model_on_length' is false by default), which is
          # what we want: Qwen spends far fewer tokens on reasoning.
          config.fallback_models: ${{ vars.PR_AGENT_FALLBACK_MODELS || '["openai/Qwen/Qwen3.8-27B-FP8"]' }}

          # The two limits below are properties of whichever model
          # PR_AGENT_MODEL selects, so they are variables too: changing the
          # model without changing them is how this gets misconfigured.
          #
          # The model CSCS serves is absent from PR Agent's model table, so its
          # limits must be declared or PR Agent treats the model as unknown.
          # Note that 'config.max_model_tokens' (default 32000) caps the *input*
          # for any model regardless of this value; we leave that default in
          # place deliberately as a cost bound, since it comfortably covers
          # GT4Py's typical PR size. Raise it if large PRs start getting
          # clipped.
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '131072' }}
          # Load-bearing: every model CSCS serves is a reasoning model, and
          # reasoning tokens are drawn from the same output budget before any
          # answer is emitted. Left unset (0), the provider default applies and
          # a review can come back truncated mid-YAML or empty -- which looks
          # like "the bot posted nothing" rather than a clean error. The default
          # here is the output budget CSCS publishes for GLM-5.3.
          config.max_output_tokens: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '32768' }}
          # Open-weight models follow the output schema more reliably when the
          # prompt examples are repeated.
          config.duplicate_prompt_examples: "true"

          # --- Which tools run automatically ---
          # '/describe' stays off: a GT4Py PR title is the squash-commit message
          # and must follow Conventional Commits, and the PR body is the commit
          # body, so an overwritten description would fight
          # '.github/pull_request_template.md'. '/improve' stays off until the
          # trial in the tracking issue says it earns its noise; both remain
          # available on demand as comments.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
