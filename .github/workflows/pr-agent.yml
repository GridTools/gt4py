name: PR Agent

# Advisory AI review of pull requests, on the CSCS inference service. Never a
# required status check. See docs/development/tools/pr-agent.md.

on:
  # Not 'pull_request': fork pull requests get no repository secrets there, and
  # most GT4Py pull requests come from forks.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

  ## Uncomment to exercise a change to this file on the pull request that makes
  ## it; works only for branches in GridTools/gt4py. It cannot test
  ## '.pr_agent.toml', which is always read from the default branch.
  # pull_request:
  #   branches:
  #     - main

# Never 'contents: write': a prompt injection in a diff must not become a way
# to push. The two write scopes are the minimum needed to publish a review, and
# they also permit label and PR-body writes from model output -- which is why
# automatic review has labels off and does not run '/describe'.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Cancelling is unsafe here: a run joins its group when queued, before the job
# 'if', so any comment on a pull request would kill that PR's in-flight review.
# Keying comment runs on the comment id keeps a newer run from evicting a
# queued command, while pull request events still collapse per PR.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    # Structural filters only; authorization is the 'Authorize' step. Drafts
    # are skipped so a pull request is reviewed once, when it is ready.
    #
    # The author bot check is not redundant with the sender check: a human
    # marking a bot-authored pull request ready leaves the author a bot, and an
    # app login is not a user to the permission API.
    if: >-
      github.event.sender.type != 'Bot'
      && (
        (
          (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
          && github.event.pull_request.draft == false
          && github.event.pull_request.user.type != 'Bot'
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Effective permission rather than 'author_association', which reports
      # private organization members as 'CONTRIBUTOR' and does not imply write
      # access even when accurate. Without a check here anyone could spend the
      # CSCS allocation by opening pull requests, since 'pull_request_target'
      # ignores the fork-approval setting.
      #
      # Fails closed, and separates "could not ask" from "asked and denied" so
      # that a broken gate cannot pass for an ordinary denial.
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Via env so a login is never substituted into the script.
          ACTOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event.pull_request.user.login }}
        run: |
          if ! level=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>&1); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve repository permission for '${ACTOR}', denying: ${level}"
            exit 1
          fi
          case "${level}" in
            admin | maintain | write)
              echo "::notice::${ACTOR} has '${level}' permission; running PR Agent."
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::${ACTOR} has '${level}' permission; skipping PR Agent."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The models have no defaults, so PR Agent never calls a model nobody
      # chose. Checking here keeps a misconfiguration red, rather than failing
      # inside the step below, which tolerates failure.
      #
      # The 'openai/' prefix is added here rather than stored in the variables:
      # it selects LiteLLM's OpenAI-compatible route and is not part of a model
      # name, so the variables hold ids exactly as CSCS publishes them.
      - name: Resolve models
        id: models
        if: steps.auth.outputs.allowed == 'true'
        env:
          MODEL: ${{ vars.PR_AGENT_MODEL }}
          FALLBACKS: ${{ vars.PR_AGENT_FALLBACK_MODELS }}
          BUDGET: ${{ vars.PR_AGENT_TOKEN_BUDGET || '65536' }}
          OUTPUT: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '16384' }}
        run: |
          fail() {
            echo "::error::$1 See docs/development/tools/pr-agent.md#configuration-variables"
            exit 1
          }
          [ -n "${MODEL}" ] || fail "Repository variable PR_AGENT_MODEL is not set."
          [ -n "${FALLBACKS}" ] || fail "Repository variable PR_AGENT_FALLBACK_MODELS is not set; use 'none' for no fallback."
          # A reserve at or above the budget leaves no room for the diff, and
          # the review then fails with "No PR diff fits" rather than saying so.
          [ "${BUDGET}" -gt "${OUTPUT}" ] || fail "PR_AGENT_TOKEN_BUDGET (${BUDGET}) must be greater than PR_AGENT_MAX_OUTPUT_TOKENS (${OUTPUT})."

          fallbacks='[]'
          [ "${FALLBACKS}" = "none" ] || fallbacks=$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0)) | map("openai/" + .)' <<<"${FALLBACKS}")
          echo "fallbacks=${fallbacks}" >> "$GITHUB_OUTPUT"
          echo "::notice::Model openai/${MODEL}, fallbacks ${fallbacks}; input cap ${BUDGET}, output reserve ${OUTPUT}."

      # Never add 'actions/checkout' here: this job holds a secret under
      # 'pull_request_target', and checking out pull request code is what would
      # make that dangerous. PR Agent reads the diff through the GitHub API.
      #
      # Pinned by digest because the image receives the inference key. This is
      # the 0.50.0-github_action image; to upgrade, resolve the digest of the
      # new '<version>-github_action' tag and update this comment.
      - name: Run PR Agent
        if: success() && steps.auth.outputs.allowed == 'true'
        # Only this step tolerates failure. The inference service has no
        # availability guarantee and an advisory reviewer must not look like a
        # CI failure, while authorization and configuration faults stay red.
        continue-on-error: true
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR Agent refuses the key and endpoint from repository config or a
          # comment argument, so neither can be redirected by a pull request.
          OPENAI.KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.inference.cscs.ch/v1' }}
          config.model: openai/${{ vars.PR_AGENT_MODEL }}
          config.fallback_models: ${{ steps.models.outputs.fallbacks }}
          # One value serves both: PR Agent takes the smaller of the two, so
          # the model's true context window never has to be configured.
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_TOKEN_BUDGET || '65536' }}
          config.max_model_tokens: ${{ vars.PR_AGENT_TOKEN_BUDGET || '65536' }}
          # Reasoning models spend this budget before answering, so too small a
          # reserve returns a truncated or empty review.
          config.max_output_tokens: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '16384' }}
          # Open-weight models follow the output schema more reliably when the
          # prompt examples are repeated.
          config.duplicate_prompt_examples: "true"
          # '/describe' and '/generate_labels' write PR metadata from model
          # output and '/improve' is noisy, so all three stay behind a human
          # request.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # Repeated from '.pr_agent.toml' because a failed fetch of that file
          # falls back to defaults that enable label writes.
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.enable_review_labels_security: "false"
