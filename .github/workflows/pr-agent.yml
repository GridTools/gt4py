name: PR Agent

# AI-assisted PR review via PR Agent (https://github.com/The-PR-Agent/pr-agent),
# backed by the CSCS inference service. Advisory only: this workflow is never a
# required status check and must not gate merges.
#
# The model, its token limits and the endpoint come from repository variables so
# they can be retuned without a code change. Defaults below apply when a
# variable is unset, so the workflow is self-contained. The PR Agent version is
# pinned here rather than in a variable: GitHub does not allow expressions in a
# step's 'uses'.
#
# Rationale, the full variable list and operational notes:
# docs/development/tools/ci-infrastructure.md#ai-assisted-pr-review-pr-agent

on:
  # 'pull_request_target' and NOT 'pull_request': most GT4Py pull requests come
  # from forks, and fork PRs get no access to repository secrets, so a
  # 'pull_request' job could never read CSCS_INFERENCE_API_KEY. The usual
  # 'pull_request_target' hazard does not apply here because this job never
  # checks out or executes PR code (see the job steps).
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  # Lets maintainers invoke commands by commenting, e.g. '/review' or '/improve'.
  issue_comment:
    types: [created]

  ## COMMENTED OUT: only for testing changes to this workflow.
  ## 'pull_request_target' and '.pr_agent.toml' are both read from the base /
  ## default branch, so changes here have no effect until merged to 'main'.
  ## Uncommenting gives a real run on the PR that changes them, but only for
  ## PRs from branches in the upstream GridTools/gt4py repo.
  # pull_request:
  #   branches:
  #     - main
  ## END

# No 'contents: write': nothing here may push to the repository, so a prompt
# injection in a PR diff cannot become a source-write primitive. Note that this
# does NOT make the model's output inert -- 'issues: write' and
# 'pull-requests: write' let PR Agent publish comments, and would let it set
# labels or rewrite a PR title/body, all from model output derived from
# untrusted PR text. Label writes are disabled in '.pr_agent.toml' and
# '/describe' is not run automatically; keep it that way, and do not widen these
# permissions.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    # Every path that spends inference credit requires a trusted author.
    #
    # Automatic review is gated on the PR author's association and NOT merely on
    # the sender not being a bot: 'pull_request_target' is exempt from the
    # "require approval for outside contributors" fork setting, so without this
    # check any stranger could spend the project's CSCS allocation just by
    # opening (or reopening) pull requests. GT4Py's core developers are all
    # 'MEMBER' even when they push from a personal fork, so this keeps automatic
    # review on essentially all real traffic; an outside contributor's PR is
    # reviewed when a maintainer asks for it with '/review'.
    #
    # Comment commands are gated on the commenter's association for the same
    # reason. Association is a coarse signal -- see the 'Authorize' step, which
    # checks effective repository permission before anything is spent.
    if: >-
      github.event.sender.type != 'Bot'
      && (
        (
          (github.event_name == 'pull_request_target' || github.event_name == 'pull_request')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    # CSCS states the inference service runs on a single infrastructure and that
    # "interruptions of the service should be expected". An advisory reviewer
    # must never look like a CI failure. Note this hides genuine failures too:
    # check the run log, not the PR's check status, when the bot stays silent.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      # 'author_association' is not an authorization decision: MEMBER only means
      # organization membership (an org whose base permission is 'read' still
      # yields MEMBER), and COLLABORATOR covers outside collaborators with
      # read-only or triage access. Those principals would otherwise be able to
      # spend inference credit and, via '/describe', have the bot rewrite a PR
      # title and body they could not edit themselves. So resolve the
      # commenter's effective permission before running anything.
      #
      # Fails closed: any API error leaves 'allowed' false. The blast radius of
      # that is comment commands only -- automatic review skips this check.
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not inline in the script, so the value is never substituted
          # into the shell command.
          COMMENTER: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "issue_comment" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          case "${level}" in
            admin | maintain | write)
              echo "::notice::${COMMENTER} has '${level}' permission; running PR Agent."
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::${COMMENTER} has '${level}' permission; skipping PR Agent."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Deliberately no 'actions/checkout': PR Agent reads the diff through the
      # GitHub API. Do not add one -- this job holds a secret under
      # 'pull_request_target', so checking out PR code would be the one change
      # that makes this workflow genuinely dangerous.
      #
      # Pinned by digest rather than tag because this job holds a secret;
      # sha256:548e894a8807... is the 0.50.0-github_action image. To upgrade,
      # bump the comment and re-resolve the digest from the release tag.
      - name: Run PR Agent
        if: steps.auth.outputs.allowed == 'true'
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- CSCS inference service (OpenAI-compatible route) ---
          # 'api_base' is a host-only setting: PR Agent rejects it as a comment
          # argument, so neither a PR's own '.pr_agent.toml' nor a '/review
          # --openai.api_base=...' comment can redirect inference. Ordinary
          # model and token settings are NOT protected that way and an
          # authorized commenter can override them per invocation.
          OPENAI.KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.inference.cscs.ch/v1' }}
          config.model: ${{ vars.PR_AGENT_MODEL || 'openai/zai-org/GLM-5.3' }}
          # On a truncated or empty response PR Agent moves to the fallback
          # model rather than retrying the same one
          # ('config.retry_same_model_on_length' is false by default), which is
          # what we want: Qwen spends far fewer tokens on reasoning.
          config.fallback_models: ${{ vars.PR_AGENT_FALLBACK_MODELS || '["openai/Qwen/Qwen3.8-27B-FP8"]' }}

          # --- Token budget: these three interact, do not tune one alone ---
          #
          # PR Agent computes, in pr_agent/algo/token_budget.py:
          #
          #   context_window = min(MODEL_CONTEXT_WINDOW, TOKEN_BUDGET)
          #   diff_budget    = context_window - MAX_OUTPUT_TOKENS
          #                                   - rendered_prompt_tokens
          #
          # The diff packer evaluates that budget unclamped, so an output
          # reserve at or above the token budget makes it negative, every file
          # is then skipped as "too large", and the model is asked to review an
          # empty diff -- no configuration error is raised. Keep a wide margin
          # between TOKEN_BUDGET and MAX_OUTPUT_TOKENS.
          #
          # With the defaults below: min(131072, 65536) - 16384 = 49152 tokens
          # of input, which is far more than a typical GT4Py PR needs (the
          # median is ~212 changed lines) while still bounding spend well below
          # the million-token window GLM-5.3 would otherwise accept. Oversized
          # diffs are clipped rather than rejected ('large_patch_policy').
          #
          # All three are properties of whichever model PR_AGENT_MODEL selects,
          # so all three are variables: changing the model without them is how
          # this gets misconfigured, and the failure is quiet.

          # What the model can do. Required because the model CSCS serves is
          # absent from PR Agent's model table, and an unknown model with no
          # declared limit raises. On its own this only raises a ceiling.
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_CONTEXT_WINDOW || '131072' }}
          # What we allow. This is the operative cap: it clamps the value
          # above, and is the number the input capacity is computed from.
          config.max_model_tokens: ${{ vars.PR_AGENT_TOKEN_BUDGET || '65536' }}
          # Headroom reserved for the answer. Load-bearing: every model CSCS
          # serves is a reasoning model, and reasoning tokens are spent from
          # this budget before any answer is emitted. Left unset (0), the
          # provider default applies and a review can come back truncated
          # mid-YAML or empty. Values below 4096 are silently raised to 4096.
          config.max_output_tokens: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '16384' }}
          # Open-weight models follow the output schema more reliably when the
          # prompt examples are repeated.
          config.duplicate_prompt_examples: "true"

          # --- Which tools run automatically ---
          # '/describe' stays off: a GT4Py PR title is the squash-commit message
          # and must follow Conventional Commits, and the PR body is the commit
          # body, so an overwritten description would fight
          # '.github/pull_request_template.md'. It is also the one command that
          # rewrites PR metadata from model output, so leaving it manual keeps a
          # human in front of that write. '/improve' stays off until the trial
          # says it earns its noise; both remain available as comments.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
